<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | CyberLegal Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body class="page-body settings-page">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-mark">C</div>
          <div>
            <p class="eyebrow">Academic Security Tool</p>
            <h2>CyberLegal Assistant</h2>
          </div>
        </div>
        <nav class="nav-menu">
          <a class="nav-item" href="{{ url_for('dashboard') }}"><span aria-hidden="true">▦</span>Dashboard</a>
          <a class="nav-item" href="{{ url_for('incident_report_page') }}"><span aria-hidden="true">＋</span>Incident Report</a>
          <a class="nav-item" href="{{ url_for('my_reports_page') }}"><span aria-hidden="true">▤</span>My Reports</a>
          <a class="nav-item" href="{{ url_for('legal_guidance_page') }}"><span aria-hidden="true">§</span>Legal Guidance</a>
          <a class="nav-item" href="{{ url_for('chat_history_page') }}"><span aria-hidden="true">◷</span>Chat History</a>
          <a class="nav-item" href="{{ url_for('safety_help_page') }}"><span aria-hidden="true">⚠</span>Safety &amp; Help</a>
          <a class="nav-item" href="{{ url_for('profile_page') }}"><span aria-hidden="true">●</span>Profile</a>
          <a class="nav-item active" href="{{ url_for('settings_page') }}"><span aria-hidden="true">⚙</span>Settings</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Application preferences</p>
            <h1>Settings</h1>
          </div>
          <div class="topbar-actions">
            <span class="user-chip">{{ username }}</span>
            <a class="logout-link" href="{{ url_for('logout') }}">Logout</a>
          </div>
        </header>

        <section class="panel">
          <div class="panel-header"><h3>Language preference</h3></div>
          <div class="setting-list">
            <label><input type="radio" name="lang" checked /> Auto Detect</label>
            <label><input type="radio" name="lang" /> English</label>
            <label><input type="radio" name="lang" /> தமிழ்</label>
            <label><input type="radio" name="lang" /> हिन्दी</label>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
